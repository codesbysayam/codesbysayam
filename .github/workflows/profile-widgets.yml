name: Update Profile README Widgets

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

concurrency:
  group: profile-widgets
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  profile-cards:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Generate GitHub stats
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&theme=nord&border_color=7dd3fc&title_color=7dd3fc&icon_color=7dd3fc&text_color=bae6fd&bg_color=0d1117&rank_icon=github&include_all_commits=true
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate top languages
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=8&theme=nord&border_color=7dd3fc&title_color=7dd3fc&text_color=bae6fd&bg_color=0d1117
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate MAUSAM pin
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=codesbysayam&repo=mausam_sample&theme=nord&border_color=7dd3fc&title_color=7dd3fc&icon_color=7dd3fc&text_color=bae6fd&bg_color=0d1117
          path: profile/pin-mausam.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate MEMORY IN MOTION pin
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=codesbysayam&repo=Memory-in-Motion&theme=nord&border_color=7dd3fc&title_color=7dd3fc&icon_color=7dd3fc&text_color=bae6fd&bg_color=0d1117
          path: profile/pin-memory-in-motion.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate YOLOv8 Edge CV pin
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=codesbysayam&repo=SightForge&theme=nord&border_color=7dd3fc&title_color=7dd3fc&icon_color=7dd3fc&text_color=bae6fd&bg_color=0d1117
          path: profile/pin-sightforge.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Operon pin
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=codesbysayam&repo=Operon&theme=nord&border_color=7dd3fc&title_color=7dd3fc&icon_color=7dd3fc&text_color=bae6fd&bg_color=0d1117
          path: profile/pin-operon.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate AXIOM pin
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=codesbysayam&repo=AXIOM&theme=nord&border_color=7dd3fc&title_color=7dd3fc&icon_color=7dd3fc&text_color=bae6fd&bg_color=0d1117
          path: profile/pin-axiom.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Inkloom pin
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=codesbysayam&repo=inkloom&theme=nord&border_color=7dd3fc&title_color=7dd3fc&icon_color=7dd3fc&text_color=bae6fd&bg_color=0d1117
          path: profile/pin-inkloom.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Portfolio pin
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=codesbysayam&repo=Sayam-Mukherjee-Portfolio&theme=nord&border_color=7dd3fc&title_color=7dd3fc&icon_color=7dd3fc&text_color=bae6fd&bg_color=0d1117
          path: profile/pin-portfolio.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Campus Connect pin
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=codesbysayam&repo=CAMPUSCONNECT_1273&theme=nord&border_color=7dd3fc&title_color=7dd3fc&icon_color=7dd3fc&text_color=bae6fd&bg_color=0d1117
          path: profile/pin-campusconnect.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Sayam Solves pin
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=codesbysayam&repo=sayam-solves&theme=nord&border_color=7dd3fc&title_color=7dd3fc&icon_color=7dd3fc&text_color=bae6fd&bg_color=0d1117
          path: profile/pin-sayam-solves.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply consistent project descriptions to cards
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          from xml.sax.saxutils import escape
          descriptions = {
              "pin-mausam.svg": ["🌦️ Mausam is a smart weather intelligence", "platform for SIH 2026 by Team Algnite. 🇮🇳", "Weather, AQI, UV, pollen, tides & more."],
              "pin-memory-in-motion.svg": ["🧠 Recurrent memory for in-context learning", "DataForge 2026 · KDAG IIT Kharagpur", "Researching compression, interference & forgetting."],
              "pin-sightforge.svg": ["👁️ Real-time computer vision with YOLOv8", "Object detection, pose estimation & tracking", "Built for practical Edge CV workflows."],
              "pin-operon.svg": ["🤖 Autonomous operations with multi-agent AI", "Human-in-the-loop workflows across teams", "Policy-aware automation with approval gates."],
              "pin-axiom.svg": ["🧠 Agentic AI operations control plane", "Policy checks, approval gates & recovery", "Auditable execution for coordinated AI agents."],
              "pin-inkloom.svg": ["🎨 AI-assisted logo design and brand systems", "Brand analysis, typography & symbol design", "Early-access platform for creative workflows."],
              "pin-portfolio.svg": ["💻 Interactive AI-powered engineering portfolio", "Projects, skills, achievements & learning journey", "Built with modern web technologies."],
              "pin-campusconnect.svg": ["🎓 Full-stack campus event management", "Discover events, register & manage activities", "Organizer dashboards for campus communities."],
              "pin-sayam-solves.svg": ["💻 Daily coding challenges and DSA practice", "Algorithms, LeetCode & problem-solving", "Building consistency one challenge at a time."],
          }
          for filename, lines in descriptions.items():
              path = Path("profile") / filename
              if not path.exists():
                  continue
              svg = path.read_text(encoding="utf-8")
              block = '<text class="description" x="25" y="-5">' + ''.join(f'<tspan dy="1.2em" x="25">{escape(line)}</tspan>' for line in lines) + '</text>'
              svg, count = re.subn(r'<text class="description" x="25" y="-5">.*?</text>', lambda _: block, svg, count=1, flags=re.S)
              if count:
                  path.write_text(svg, encoding="utf-8")
          PY

      - name: Generate GitHub trophies
        uses: soulteary/github-profile-trophy-action@v1.0.0
        with:
          options: username=${{ github.repository_owner }}&theme=nord&no-frame=true&no-bg=true&row=1&column=7
          path: profile/trophy.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate contribution activity graph
        uses: maurodesouza/github-readme-activity-graph-action@v1
        with:
          username: ${{ github.repository_owner }}
          options: bg_color=0d1117&color=7dd3fc&line=7dd3fc&point=bae6fd&area=true&hide_border=false&border_color=7dd3fc&area_color=0a2a3a&custom_title=Contribution%20Activity&radius=8&height=300
          output_path: profile/activity-graph.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit generated profile assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "chore: refresh profile widgets" || echo "No widget changes"
          git pull --rebase origin main
          git push origin HEAD:main

  snake:
    runs-on: ubuntu-latest
    steps:
      - name: Generate contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            output/github-snake.svg?palette=github-light
            output/github-snake-dark.svg?palette=github-dark
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
