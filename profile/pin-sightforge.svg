<svg xmlns="http://www.w3.org/2000/svg" width="500" height="188" viewBox="0 0 500 188" role="img" aria-label="SightForge repository card">
  <title>SightForge GitHub repository card</title>
  <rect x="1" y="1" width="498" height="186" rx="6" fill="#0d1117" stroke="#7dd3fc" stroke-width="1.5"/>
  <g transform="translate(31 28)" fill="none" stroke="#7dd3fc" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2" y="1" width="13" height="16" rx="1"/>
    <path d="M5 17v4l4-2 4 2v-4"/>
  </g>
  <text x="60" y="43" class="header">SightForge</text>
  <text x="32" y="82" class="description">👁️ Real-time computer vision powered by YOLOv8</text>
<text x="32" y="106" class="description">Object detection, pose estimation &amp; tracking</text>
<text x="32" y="130" class="description">Designed for practical Edge CV workflows.</text>
  <circle cx="36" cy="160" r="7" fill="#3178c6"/><text x="58" y="165" class="language">TypeScript</text>
  <style>
    .header{font:600 22px 'Segoe UI',Ubuntu,Arial,sans-serif;fill:#7dd3fc}
    .description{font:400 15.5px 'Segoe UI',Ubuntu,Arial,sans-serif;fill:#bae6fd}
    .language{font:400 14px 'Segoe UI',Ubuntu,Arial,sans-serif;fill:#bae6fd}
  </style>
</svg>